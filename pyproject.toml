[project]
name = "grokking-bayes"
version = "0.1.0"
description = "Grokking Bayes — educational Marimo notebooks"
requires-python = ">=3.10,<3.11"
dependencies = [
    "arviz==0.22.0",
    "marimo>=0.9.0",
    "matplotlib==3.10.3",
    "numpy>=1.26.0,<2.0",
    "pandas==2.3.0",
    "pymc==5.25.1",
    "pytensor==2.31.7",
    "scikit-learn==1.7.0",
    "scipy==1.15.3",
    "seaborn==0.13.2",
    "torch==2.2.2",
    "tqdm==4.67.1",
    "xarray==2025.6.1",
    "xarray-einstats==0.8.0",
    "numba>=0.59.0",
]

[dependency-groups]
dev = ["pytest", "pytest-timeout"]

[tool.pytest.ini_options]
timeout = 3600  # 1 hour — accounts for Numba JIT warmup + MCMC sampling

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
