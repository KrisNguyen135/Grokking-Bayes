[project]
name = "grokking-bayes"
version = "0.1.0"
description = "Grokking Bayes — educational Jupyter notebooks"
requires-python = ">=3.10,<3.11"
dependencies = [
    "arviz==0.22.0",
    "ipykernel==6.29.5",
    "ipython==8.37.0",
    "ipywidgets==8.1.7",
    "jupyter-client==8.6.3",
    "jupyter-core==5.8.1",
    "jupyter-events==0.12.0",
    "jupyter-lsp==2.2.5",
    "jupyter-server==2.16.0",
    "jupyter-server-terminals==0.5.3",
    "jupyterlab==4.4.4",
    "jupyterlab-pygments==0.3.0",
    "jupyterlab-server==2.27.3",
    "jupyterlab-widgets==3.0.15",
    "matplotlib==3.10.3",
    "matplotlib-inline==0.1.7",
    "numpy>=1.26.0,<2.0",
    "pandas==2.3.0",
    "pymc==5.25.1",
    "pytensor==2.31.7",
    "scikit-learn==1.7.0",
    "scipy==1.15.3",
    "seaborn==0.13.2",
    "torch==2.2.2",
    "tqdm==4.67.1",
    "xarray==2025.6.1",
    "xarray-einstats==0.8.0",
    "numba>=0.59.0",
]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
